<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 320" width="900" height="320" role="img">
<style>
.m{font-family:ui-monospace,'JetBrains Mono','SF Mono',Consolas,'Liberation Mono',monospace} .s{font-family:'Segoe UI',system-ui,-apple-system,'Helvetica Neue',Arial,sans-serif} .fb{transform-box:fill-box}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}
@keyframes up{0%{transform:translateY(0);opacity:0}10%{opacity:.8}90%{opacity:.5}100%{transform:translateY(-340px);opacity:0}} .pt{opacity:0;animation:up linear infinite}
@keyframes br{0%,100%{opacity:.75;transform:scale(1)}50%{opacity:1;transform:scale(1.12)}} .breath{transform-origin:center;transform-box:fill-box;animation:br 3.6s ease-in-out infinite}
.t{opacity:0;animation:tk 12s infinite backwards} .t1{opacity:1} .t2{animation-delay:3s} .t3{animation-delay:6s} .t4{animation-delay:9s}
@keyframes tk{0%{opacity:0}3%,23%{opacity:1}26%,100%{opacity:0}}
.cur{animation:k 1s steps(1) infinite} @keyframes k{50%{opacity:0}}
</style><defs>
