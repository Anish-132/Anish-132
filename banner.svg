<svg xmlns="http://www.w3.org/2000/svg" width="900" height="240" viewBox="0 0 900 240" role="img" aria-label="Hey, I'm Anish. Self-taught and still learning." xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#1c1a19"/><stop offset="1" stop-color="#2b231f"/></linearGradient>
<radialGradient id="glow" cx="0.5" cy="0.5" r="0.5"><stop offset="0" stop-color="#D97757" stop-opacity="0.55"/><stop offset="1" stop-color="#D97757" stop-opacity="0"/></radialGradient>
<linearGradient id="bar" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#D97757"/><stop offset="1" stop-color="#f0a983"/></linearGradient>
</defs>
<style>
.spin{transform-box:fill-box;transform-origin:center;animation:spin 24s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.pulse{animation:pulse 4s ease-in-out infinite}
@keyframes pulse{50%{opacity:.55}}
.in{animation:in .9s ease-out both}
.d1{animation-delay:.15s}.d2{animation-delay:.4s}.d3{animation-delay:.65s}
@keyframes in{from{opacity:0;transform:translateY(10px)}}
.blink{animation:blink 1.1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
</style>
<rect width="900" height="240" rx="18" fill="url(#bg)"/>
<rect x="0.5" y="0.5" width="899" height="239" rx="17.5" fill="none" stroke="#D97757" stroke-opacity="0.35"/>
<circle class="pulse" cx="150" cy="120" r="150" fill="url(#glow)"/>
<g transform="translate(150 120)"><g class="spin" stroke="#D97757" stroke-width="9" stroke-linecap="round"><line x1="0" y1="-38" x2="0" y2="-10" transform="rotate(0)"/><line x1="0" y1="-38" x2="0" y2="-10" transform="rotate(45)"/><line x1="0" y1="-38" x2="0" y2="-10" transform="rotate(90)"/><line x1="0" y1="-38" x2="0" y2="-10" transform="rotate(135)"/><line x1="0" y1="-38" x2="0" y2="-10" transform="rotate(180)"/><line x1="0" y1="-38" x2="0" y2="-10" transform="rotate(225)"/><line x1="0" y1="-38" x2="0" y2="-10" transform="rotate(270)"/><line x1="0" y1="-38" x2="0" y2="-10" transform="rotate(315)"/></g></g>
<g font-family="'Segoe UI',-apple-system,Helvetica,Arial,sans-serif">
<text class="in d1" x="290" y="98" font-size="52" font-weight="700" fill="#faf9f5">Hey, I'm Anish</text>
<rect class="in d2" x="292" y="120" width="120" height="5" rx="2.5" fill="url(#bar)"/>
<text class="in d2" x="290" y="152" font-size="24" fill="#D97757">Self-taught and still learning</text>
<text class="in d3" x="290" y="188" font-size="18" fill="#a8a29e">Python  ·  Automation  ·  Windows tooling</text>
</g>
<g font-family="SFMono-Regular,Consolas,'Liberation Mono',Menlo,monospace" font-size="15" fill="#a8a29e">
<text x="290" y="220"><tspan fill="#D97757">&gt;</tspan> building with Claude Code<tspan class="blink" fill="#D97757"> ▍</tspan></text>
</g>
</svg>
