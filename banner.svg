<text x="44" y="108" class="m" font-size="70" font-weight="700" fill="url(#gr)" letter-spacing="-3">Anish</text>
<text x="46" y="146" class="s" font-size="18" fill="#ece9ff">self-taught builder, automation and Windows tooling</text>
<text x="46" y="172" class="s" font-size="14" fill="#8f89b8">I measure what broke, then fix the cause, not the symptom.</text>
<g class="m" font-size="13">
<rect x="46" y="204" width="400" height="74" rx="8" fill="#100d1f" stroke="#2b2352"/>
<text x="62" y="226" fill="#ff4fd8">$</text><text x="76" y="226" fill="#ece9ff">flow --audit</text>
<g transform="translate(62,256)">
<text class="t t1" fill="#ece9ff" y="0"><tspan fill="#4d9dff">›</tspan> fingerprinting cpu, ram, disk, gpu</text>
