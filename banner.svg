<text class="t t3" fill="#ece9ff" y="0"><tspan fill="#ffd36e">›</tspan> skipping tweaks this machine can't take</text>
<text class="t t4" fill="#ece9ff" y="0"><tspan fill="#ff4fd8">›</tspan> applied, every change revertible<tspan class="cur" fill="#ff4fd8"> ▌</tspan></text>
