<svg xmlns="http://www.w3.org/2000/svg" width="900" height="342" viewBox="0 0 900 342" role="img" aria-label="Flow-Win-Opt: a Windows optimizer that reads your hardware first, then only offers tweaks that make sense. Fingerprints CPU, RAM, disk and GPU. 200+ researched tweaks gated by OS and hardware across 4 risk tiers. Restore point first, every change logged and revertible. Optional background mode. Python, PowerShell, MIT, no longer maintained.">
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#1c1a19"/><stop offset="1" stop-color="#2b231f"/></linearGradient>
<radialGradient id="g" cx="1" cy="0" r="0.8"><stop offset="0" stop-color="#D97757" stop-opacity="0.28"/><stop offset="1" stop-color="#D97757" stop-opacity="0"/></radialGradient></defs>
<style>.r{animation:up .7s ease-out both}@keyframes up{from{opacity:0;transform:translateY(8px)}}</style>
<rect width="900" height="342" rx="16" fill="url(#bg)"/><rect width="900" height="342" rx="16" fill="url(#g)"/>
<rect x="0.5" y="0.5" width="899" height="341" rx="15.5" fill="none" stroke="#D97757" stroke-opacity="0.4"/>
<text x="30" y="52" font-family="'Segoe UI',-apple-system,Helvetica,Arial,sans-serif" font-size="34" font-weight="700" fill="#faf9f5">Flow-Win-Opt</text>
<text x="30" y="82" font-family="'Segoe UI',-apple-system,Helvetica,Arial,sans-serif" font-size="16" fill="#D97757">A Windows optimizer that reads your hardware first,</text>
<text x="30" y="102" font-family="'Segoe UI',-apple-system,Helvetica,Arial,sans-serif" font-size="16" fill="#D97757">then only offers tweaks that make sense for your machine.</text>
<g class="r" style="animation-delay:0.2s"><circle cx="46" cy="127" r="9" fill="#D97757" fill-opacity="0.18" stroke="#D97757"/><path d="M41.5 127l3.2 3.2 5.8-6.4" fill="none" stroke="#D97757" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><text x="68" y="132" font-family="'Segoe UI',-apple-system,Helvetica,Arial,sans-serif" font-size="16" fill="#e7e2dc">Fingerprints CPU, RAM, disk type, and GPU</text></g><g class="r" style="animation-delay:0.35s"><circle cx="46" cy="163" r="9" fill="#D97757" fill-opacity="0.18" stroke="#D97757"/><path d="M41.5 163l3.2 3.2 5.8-6.4" fill="none" stroke="#D97757" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><text x="68" y="168" font-family="'Segoe UI',-apple-system,Helvetica,Arial,sans-serif" font-size="16" fill="#e7e2dc">200+ researched tweaks, gated by OS and hardware</text></g><g class="r" style="animation-delay:0.5s"><circle cx="46" cy="199" r="9" fill="#D97757" fill-opacity="0.18" stroke="#D97757"/><path d="M41.5 199l3.2 3.2 5.8-6.4" fill="none" stroke="#D97757" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><text x="68" y="204" font-family="'Segoe UI',-apple-system,Helvetica,Arial,sans-serif" font-size="16" fill="#e7e2dc">Restore point first, every change logged and revertible</text></g><g class="r" style="animation-delay:0.6499999999999999s"><circle cx="46" cy="235" r="9" fill="#D97757" fill-opacity="0.18" stroke="#D97757"/><path d="M41.5 235l3.2 3.2 5.8-6.4" fill="none" stroke="#D97757" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><text x="68" y="240" font-family="'Segoe UI',-apple-system,Helvetica,Arial,sans-serif" font-size="16" fill="#e7e2dc">Background mode runs safe daily chores and auto-blocks</text><text x="68" y="261" font-family="'Segoe UI',-apple-system,Helvetica,Arial,sans-serif" font-size="16" fill="#e7e2dc">tweaks that keep failing or get overwritten</text></g>
<text x="690" y="98" font-family="SFMono-Regular,Consolas,'Liberation Mono',Menlo,monospace" font-size="12" fill="#a8a29e" letter-spacing="1.5">RISK TIERS</text>
<g class="r" style="animation-delay:0.4s"><rect x="690" y="112" width="40" height="14" rx="7" fill="#D97757" fill-opacity="0.35"/><text x="740" y="124" font-family="SFMono-Regular,Consolas,'Liberation Mono',Menlo,monospace" font-size="13" fill="#a8a29e">minimal</text></g><g class="r" style="animation-delay:0.55s"><rect x="690" y="142" width="70" height="14" rx="7" fill="#D97757" fill-opacity="0.57"/><text x="770" y="154" font-family="SFMono-Regular,Consolas,'Liberation Mono',Menlo,monospace" font-size="13" fill="#a8a29e">standard</text></g><g class="r" style="animation-delay:0.7s"><rect x="690" y="172" width="100" height="14" rx="7" fill="#D97757" fill-opacity="0.79"/><text x="800" y="184" font-family="SFMono-Regular,Consolas,'Liberation Mono',Menlo,monospace" font-size="13" fill="#a8a29e">maximal</text></g><g class="r" style="animation-delay:0.85s"><rect x="690" y="202" width="130" height="14" rx="7" fill="#D97757" fill-opacity="1.01"/><text x="830" y="214" font-family="SFMono-Regular,Consolas,'Liberation Mono',Menlo,monospace" font-size="13" fill="#a8a29e">extreme</text></g>
<rect x="30" y="294" width="75" height="28" rx="14" fill="#3776AB"/><text x="67.5" y="313" text-anchor="middle" font-family="'Segoe UI',-apple-system,Helvetica,Arial,sans-serif" font-size="13" font-weight="600" fill="#fff">Python</text><rect x="115" y="294" width="108" height="28" rx="14" fill="#5391FE"/><text x="169.0" y="313" text-anchor="middle" font-family="'Segoe UI',-apple-system,Helvetica,Arial,sans-serif" font-size="13" font-weight="600" fill="#fff">PowerShell</text><rect x="233" y="294" width="50" height="28" rx="14" fill="#30363d"/><text x="258.0" y="313" text-anchor="middle" font-family="'Segoe UI',-apple-system,Helvetica,Arial,sans-serif" font-size="13" font-weight="600" fill="#e7e2dc">MIT</text><rect x="293" y="294" width="190" height="28" rx="14" fill="#3a3633"/><text x="388.0" y="313" text-anchor="middle" font-family="'Segoe UI',-apple-system,Helvetica,Arial,sans-serif" font-size="13" font-weight="600" fill="#a8a29e">no longer maintained</text>
<text x="870" y="313" text-anchor="end" font-family="SFMono-Regular,Consolas,'Liberation Mono',Menlo,monospace" font-size="12" fill="#a8a29e">click to open repo ↗</text>
