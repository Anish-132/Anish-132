<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 64" width="900" height="64" role="img">
<style>.s{font-family:'Segoe UI',system-ui,-apple-system,'Helvetica Neue',Arial,sans-serif} .m{font-family:ui-monospace,'JetBrains Mono','SF Mono',Consolas,'Liberation Mono',monospace}.gl{opacity:0} .g1{animation:g1 7s infinite} .g2{animation:g2 7s infinite}
@keyframes g1{0%,90%{opacity:0;transform:translate(0,0)}91%{opacity:.85;transform:translate(-3px,0)}93%{opacity:.85;transform:translate(2px,-1px)}95%,100%{opacity:0}}
@keyframes g2{0%,90%{opacity:0;transform:translate(0,0)}92%{opacity:.85;transform:translate(3px,1px)}94%{opacity:.85;transform:translate(-2px,0)}96%,100%{opacity:0}}
.sw{animation:sw 4.5s cubic-bezier(.6,0,.4,1) infinite} @keyframes sw{0%{transform:translateX(-160px)}100%{transform:translateX(900px)}}
.bl{animation:bl 1.1s steps(1) infinite} @keyframes bl{50%{opacity:0}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style>
<defs><linearGradient id="sg" x1="0" x2="1"><stop offset="0" stop-color="#9d7bff" stop-opacity="0"/><stop offset=".5" stop-color="#4d9dff"/><stop offset="1" stop-color="#ff4fd8" stop-opacity="0"/></linearGradient>
<clipPath id="cl"><rect x="0" y="52" width="900" height="3"/></clipPath></defs>
<rect x="6" y="20" width="10" height="22" fill="#9d7bff" class="bl"/>
<text x="32" y="41" class="s gl g1" font-size="28" font-weight="800" fill="#ff4fd8">The lab</text>
<text x="32" y="41" class="s gl g2" font-size="28" font-weight="800" fill="#4d9dff">The lab</text>
<text x="32" y="41" class="s" font-size="28" font-weight="800" fill="#ece9ff">The lab</text>
<text x="894" y="40" text-anchor="end" class="m" font-size="12" fill="#8f89b8">// 2 laptops, 1 cable</text>
<rect x="6" y="52" width="888" height="1.5" fill="#2b2352"/>
<g clip-path="url(#cl)"><rect class="sw" x="0" y="52" width="160" height="3" fill="url(#sg)"/></g>
</svg>