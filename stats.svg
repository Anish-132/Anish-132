<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 200" width="900" height="200" role="img">
<style>
.m{font-family:ui-monospace,'JetBrains Mono','SF Mono',Consolas,'Liberation Mono',monospace} .s{font-family:'Segoe UI',system-ui,-apple-system,'Helvetica Neue',Arial,sans-serif} .fb{transform-box:fill-box}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}
.st{transform-origin:left} @media (prefers-reduced-motion:no-preference){.st{animation:sk 10s infinite}.nv,.ar{animation:nw 10s infinite}}
@keyframes sk{0%,5%{transform:scaleX(0)}14%,100%{transform:scaleX(1)}} @keyframes nw{0%,13%{opacity:0}20%,100%{opacity:1}}
.r2 *{animation-delay:.9s!important}.r3 *{animation-delay:1.8s!important}
</style><defs>
<linearGradient id="gr" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#9d7bff"/><stop offset=".55" stop-color="#4d9dff"/><stop offset="1" stop-color="#ff4fd8"/></linearGradient>
<radialGradient id="core"><stop offset="0" stop-color="#fff" stop-opacity=".95"/><stop offset=".35" stop-color="#9d7bff"/><stop offset="1" stop-color="#4d9dff" stop-opacity="0"/></radialGradient>
<filter id="gl" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="9"/></filter>
<linearGradient id="fadeL" x1="0" x2="1"><stop offset="0" stop-color="#07060e"/><stop offset="1" stop-color="#07060e" stop-opacity="0"/></linearGradient>
<linearGradient id="fadeR" x1="1" x2="0"><stop offset="0" stop-color="#07060e"/><stop offset="1" stop-color="#07060e" stop-opacity="0"/></linearGradient>
</defs>
<rect width="900" height="200" rx="14" fill="#07060e"/>
<text x="30" y="34" class="m" font-size="12" fill="#8f89b8">git diff --stat   (before → after)</text><g class="r1"><text x="30" y="78" class="m" font-size="20" fill="#8f89b8">2.85 GiB</text><rect class="st fb" x="28" y="71" width="100" height="2.5" fill="#ff4fd8"/><text class="ar m" x="205" y="78" font-size="19" fill="#9d7bff">→</text><text class="nv m" x="240" y="78" font-size="23" font-weight="700" fill="#ece9ff">475 KB</text><text class="s" x="460" y="78" font-size="13" fill="#8f89b8">git history, rescued after repeated blackout corruption</text></g><g class="r2"><text x="30" y="124" class="m" font-size="20" fill="#8f89b8">1 free model</text><rect class="st fb" x="28" y="117" width="148" height="2.5" fill="#ff4fd8"/><text class="ar m" x="205" y="124" font-size="19" fill="#9d7bff">→</text><text class="nv m" x="240" y="124" font-size="23" font-weight="700" fill="#ece9ff">21 combos</text><text class="s" x="460" y="124" font-size="13" fill="#8f89b8">Claude Code routing pool behind a local bridge, health-probed</text></g><g class="r3"><text x="30" y="170" class="m" font-size="20" fill="#8f89b8">blind tweaks</text><rect class="st fb" x="28" y="163" width="148" height="2.5" fill="#ff4fd8"/><text class="ar m" x="205" y="170" font-size="19" fill="#9d7bff">→</text><text class="nv m" x="240" y="170" font-size="23" font-weight="700" fill="#ece9ff">200+ gated</text><text class="s" x="460" y="170" font-size="13" fill="#8f89b8">every tweak checked against OS and hardware first</text></g>
<rect x=".5" y=".5" width="899" height="199" rx="13.5" fill="none" stroke="#2b2352"/>
</svg>