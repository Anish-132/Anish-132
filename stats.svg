<text x="30" y="34" class="m" font-size="12" fill="#8f89b8">git diff --stat   (before → after)</text><text x="30" y="76" class="s" font-size="13.5" fill="#8f89b8">git history, rescued after repeated blackout corruption</text><rect x="30" y="90" width="500" height="10" rx="5" fill="#2b2352"/><rect class="bf0 fb" x="30" y="90" width="500" height="10" rx="5" fill="#9d7bff" style="transform-origin:left;transform:scaleX(0.03)"/><g class="o0" opacity="0"><text x="570" y="100" class="m" font-size="22" fill="#8f89b8">2.85 GiB</text><rect x="568" y="93" width="108" height="2.5" fill="#ff4fd8"/></g><text class="n0 m" x="570" y="100" font-size="26" font-weight="700" fill="#ece9ff">475 KB</text><text x="30" y="160" class="s" font-size="13.5" fill="#8f89b8">Claude Code routing pool behind a local bridge, health-probed</text><rect x="30" y="174" width="500" height="10" rx="5" fill="#2b2352"/><rect class="bf1 fb" x="30" y="174" width="500" height="10" rx="5" fill="#4d9dff" style="transform-origin:left;transform:scaleX(1.0)"/><g class="o1" opacity="0"><text x="570" y="184" class="m" font-size="22" fill="#8f89b8">1 model</text><rect x="568" y="177" width="95" height="2.5" fill="#ff4fd8"/></g><text class="n1 m" x="570" y="184" font-size="26" font-weight="700" fill="#ece9ff">21 combos</text><text x="30" y="244" class="s" font-size="13.5" fill="#8f89b8">every tweak checked against OS and hardware first</text><rect x="30" y="258" width="500" height="10" rx="5" fill="#2b2352"/><rect class="bf2 fb" x="30" y="258" width="500" height="10" rx="5" fill="#ff4fd8" style="transform-origin:left;transform:scaleX(1.0)"/><g class="o2" opacity="0"><text x="570" y="268" class="m" font-size="22" fill="#8f89b8">blind tweaks</text><rect x="568" y="261" width="160" height="2.5" fill="#ff4fd8"/></g><text class="n2 m" x="570" y="268" font-size="26" font-weight="700" fill="#ece9ff">200+ gated</text>
