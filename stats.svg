<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 298" width="900" height="298" role="img">
<style>
.m{font-family:ui-monospace,'JetBrains Mono','SF Mono',Consolas,'Liberation Mono',monospace} .s{font-family:'Segoe UI',system-ui,-apple-system,'Helvetica Neue',Arial,sans-serif} .fb{transform-box:fill-box}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}
.bf0{animation:bf0 10s ease-in-out infinite;animation-delay:0.0s} @keyframes bf0{0%,30%{transform:scaleX(1.0)}55%,100%{transform:scaleX(0.03)}}
