<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 306" width="900" height="306" role="img">
<style>
.m{font-family:ui-monospace,'JetBrains Mono','SF Mono',Consolas,'Liberation Mono',monospace} .s{font-family:'Segoe UI',system-ui,-apple-system,'Helvetica Neue',Arial,sans-serif} .fb{transform-box:fill-box}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}
.ec{animation:ec .9s linear infinite} @keyframes ec{to{transform:translateX(-55px)}}
.dim{opacity:0;animation:dm 12s infinite} @keyframes dm{0%,24%{opacity:0}28%,50%{opacity:.94}54%,100%{opacity:0}}
.out1{opacity:0;animation:ou 12s infinite} .ok1{animation:ok 12s infinite}
@keyframes ou{0%,24%{opacity:0}26%,53%{opacity:1}56%,100%{opacity:0}} @keyframes ok{0%,24%{opacity:1}26%,53%{opacity:0}56%,100%{opacity:1}}
.cab{animation:cb 12s infinite} @keyframes cb{0%,24%{opacity:1}28%,58%{opacity:.1}64%,100%{opacity:1}}
.pkt{opacity:0;animation:pk 12s infinite} @keyframes pk{0%,56%{opacity:0;transform:translateX(0)}57%{opacity:1;transform:translateX(0)}66%{opacity:1;transform:translateX(140px)}67%,100%{opacity:0;transform:translateX(140px)}}
.wol{opacity:0;animation:wl 12s infinite} @keyframes wl{0%,55%{opacity:0}58%,66%{opacity:1}68%,100%{opacity:0}}
.ledB{animation:lb 12s infinite} @keyframes lb{0%,24%{opacity:1}28%,52%{opacity:.12}58%,100%{opacity:1}}
.ledA{animation:la 2.4s steps(2,jump-none) infinite} @keyframes la{50%{opacity:.3}}
.ec1{animation:e1 12s infinite} @keyframes e1{0%,26%{opacity:1}28%,56%{opacity:0}58%,100%{opacity:1}}
.flat{animation:fl 12s infinite} @keyframes fl{0%,26%{opacity:0}28%,56%{opacity:1}58%,100%{opacity:0}}
.lg{opacity:0} .l4{opacity:1}
.l1{animation:g1x 12s infinite} .l2{animation:g2x 12s infinite} .l3{animation:g3x 12s infinite} .l4{animation:g4x 12s infinite}
@keyframes g1x{0%,23%{opacity:1}25%,100%{opacity:0}} @keyframes g2x{0%,23%{opacity:0}25%,40%{opacity:1}42%,100%{opacity:0}}
@keyframes g3x{0%,40%{opacity:0}42%,56%{opacity:1}58%,100%{opacity:0}} @keyframes g4x{0%,56%{opacity:0}58%,100%{opacity:1}}
.cur{animation:k 1s steps(1) infinite} @keyframes k{50%{opacity:0}}
</style><defs>
<linearGradient id="gr" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#9d7bff"/><stop offset=".55" stop-color="#4d9dff"/><stop offset="1" stop-color="#ff4fd8"/></linearGradient>
<radialGradient id="core"><stop offset="0" stop-color="#fff" stop-opacity=".95"/><stop offset=".35" stop-color="#9d7bff"/><stop offset="1" stop-color="#4d9dff" stop-opacity="0"/></radialGradient>
<filter id="gl" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="9"/></filter>
<linearGradient id="fadeL" x1="0" x2="1"><stop offset="0" stop-color="#07060e"/><stop offset="1" stop-color="#07060e" stop-opacity="0"/></linearGradient>
<linearGradient id="fadeR" x1="1" x2="0"><stop offset="0" stop-color="#07060e"/><stop offset="1" stop-color="#07060e" stop-opacity="0"/></linearGradient>
</defs>
<rect width="900" height="306" rx="14" fill="#07060e"/>
<text x="30" y="34" class="m" font-size="12" fill="#8f89b8">lab.spec   (a power cut, replayed)</text><g class="cab"><path d="M 150 99 H 290" stroke="#4d9dff" stroke-width="3" opacity=".5"/>
<circle r="3.5" fill="#ece9ff"><animateMotion dur="1.5s" repeatCount="indefinite" path="M150 99 H290"/></circle>
<circle r="3.5" fill="#ece9ff"><animateMotion dur="1.5s" begin=".75s" repeatCount="indefinite" path="M290 99 H150"/></circle></g>
<circle class="pkt" cx="150" cy="99" r="6" fill="#ffd36e"/>
<rect x="40" y="64" width="110" height="70" rx="6" fill="#100d1f" stroke="#4d9dff" stroke-width="1.5"/><rect x="48" y="72" width="94" height="54" rx="2" fill="#07060e"/><path d="M 31 141 H 159" stroke="#4d9dff" stroke-width="3" stroke-linecap="round"/><text x="95" y="54" text-anchor="middle" class="m" font-size="12" fill="#4d9dff">ASUS</text><rect x="290" y="64" width="110" height="70" rx="6" fill="#100d1f" stroke="#ffd36e" stroke-width="1.5"/><rect x="298" y="72" width="94" height="54" rx="2" fill="#07060e"/><path d="M 281 141 H 409" stroke="#ffd36e" stroke-width="3" stroke-linecap="round"/><text x="345" y="54" text-anchor="middle" class="m" font-size="12" fill="#ffd36e">HP</text>
<rect class="dim fb" x="298" y="72" width="94" height="54" rx="2" fill="#07060e"/>
<circle cx="95" cy="156" r="3" fill="#4d9dff" class="ledA"/><circle class="ledB" cx="345" cy="156" r="3" fill="#ffd36e"/>
<g class="m" font-size="11" text-anchor="middle">
<text x="95" y="180" class="ok1" fill="#4d9dff">mains ok</text><text x="95" y="180" class="out1" fill="#ff4fd8">mains out</text>
<text x="345" y="180" class="ok1" fill="#ffd36e">up</text><text x="345" y="180" class="out1" fill="#ff4fd8">down</text>
<text x="220" y="94" class="wol" fill="#ece9ff" font-size="10">magic packet</text></g>
<clipPath id="ce1"><rect x="40" y="206" width="110" height="36"/></clipPath><g clip-path="url(#ce1)"><g transform="translate(40,206)"><g class="ec"><path d="M0 18 H10 L14 18 L17 6 L22 30 L26 18 H40 L44 14 L48 18 H55 M55 18 H65 L69 18 L72 6 L77 30 L81 18 H95 L99 14 L103 18 H110 M110 18 H120 L124 18 L127 6 L132 30 L136 18 H150 L154 14 L158 18 H165 M165 18 H175 L179 18 L182 6 L187 30 L191 18 H205 L209 14 L213 18 H220" fill="none" stroke="#4d9dff" stroke-width="1.8" stroke-linejoin="round"/></g></g></g>
<g class="ec1"><clipPath id="ce2"><rect x="290" y="206" width="110" height="36"/></clipPath><g clip-path="url(#ce2)"><g transform="translate(290,206)"><g class="ec"><path d="M0 18 H10 L14 18 L17 6 L22 30 L26 18 H40 L44 14 L48 18 H55 M55 18 H65 L69 18 L72 6 L77 30 L81 18 H95 L99 14 L103 18 H110 M110 18 H120 L124 18 L127 6 L132 30 L136 18 H150 L154 14 L158 18 H165 M165 18 H175 L179 18 L182 6 L187 30 L191 18 H205 L209 14 L213 18 H220" fill="none" stroke="#ffd36e" stroke-width="1.8" stroke-linejoin="round"/></g></g></g></g>
<path class="flat" d="M290 224 H400" stroke="#ff4fd8" stroke-width="1.8" opacity="0"/>
<g class="m" font-size="11">
<text x="30" y="270" fill="#8f89b8">log</text>
<text x="62" y="270" class="lg l1" fill="#ece9ff"><tspan fill="#4d9dff">ok  </tspan>mains ok, both nodes up</text>
<text x="62" y="270" class="lg l2" fill="#ece9ff"><tspan fill="#ff4fd8">!!  </tspan>mains lost, HP shutting down in 25 s</text>
<text x="62" y="270" class="lg l3" fill="#ece9ff"><tspan fill="#ffd36e">..  </tspan>flag written on the ASUS, waiting for power</text>
<text x="62" y="270" class="lg l4" fill="#ece9ff"><tspan fill="#4d9dff">ok  </tspan>magic packet sent, HP is back<tspan class="cur" fill="#4d9dff"> ▌</tspan></text></g><line x1="470" y1="50" x2="470" y2="290" stroke="#2b2352"/><text x="500" y="62" class="s" font-size="18" font-weight="700" fill="#ece9ff">ASUS TUF</text><text x="500" y="84" class="s" font-size="13" fill="#4d9dff">daily driver</text><text x="500" y="110" class="m" font-size="11.5" fill="#8f89b8">Ryzen 7 8845H, RTX 3050 4 GB</text><text x="500" y="130" class="m" font-size="11.5" fill="#8f89b8">7.2 GB usable RAM, Windows</text><text x="500" y="150" class="m" font-size="11.5" fill="#8f89b8">runs Claude Code and heavy jobs</text><text x="500" y="198" class="s" font-size="18" font-weight="700" fill="#ece9ff">HP 15 Notebook</text><text x="500" y="220" class="s" font-size="13" fill="#ffd36e">agent sandbox, disposable on purpose</text><text x="500" y="246" class="m" font-size="11.5" fill="#8f89b8">i3, 4 GB, Linux Mint</text><text x="500" y="266" class="m" font-size="11.5" fill="#8f89b8">key-only SSH, no sudo</text><text x="500" y="286" class="m" font-size="11.5" fill="#8f89b8">failing HDD, every write stays small</text>
<rect x=".5" y=".5" width="899" height="305" rx="13.5" fill="none" stroke="#2b2352"/>
</svg>