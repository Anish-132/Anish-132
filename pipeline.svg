<svg xmlns="http://www.w3.org/2000/svg" width="900" height="200" viewBox="0 0 900 200" role="img" aria-label="Automated video pipeline: topic, script, voice, render, upload, analytics, with results feeding the next run. 200+ videos published this way.">
